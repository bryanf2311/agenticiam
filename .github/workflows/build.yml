name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: agenticiam-linux-x64
            bin: agenticiam
            gui_bin: agenticiam-gui
          - os: windows-latest
            asset: agenticiam-windows-x64
            bin: agenticiam.exe
            gui_bin: agenticiam-gui.exe
          - os: macos-latest
            asset: agenticiam-macos-arm64
            bin: agenticiam
            gui_bin: agenticiam-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pyinstaller agenticiam.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-gui
          path: dist/${{ matrix.gui_bin }}
